# Ruff lint + format check (issue #658). The repo-wide cleanup is still
# incremental: Python files changed by a PR must be clean, while legacy
# findings in untouched files do not block it. A later mechanical cleanup can
# widen this to the whole tree without changing the tool or its configuration.
name: lint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checkout is its merge commit; its first parent is the base.
          # Two commits are enough for a changed-file list, without full history.
          fetch-depth: 2
          filter: blob:none
      - uses: astral-sh/setup-uv@v5
      - name: blocking Ruff check on changed Python files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR -z \
            "$GITHUB_SHA^1" "$GITHUB_SHA" -- '*.py' > "$RUNNER_TEMP/changed-python-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python-files"
          if ((${#files[@]} == 0)); then
            echo "No changed Python files to lint."
            exit 0
          fi
          printf 'Linting %s changed Python file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          uv run --frozen ruff check "${files[@]}"
          uv run --frozen ruff format --check "${files[@]}"

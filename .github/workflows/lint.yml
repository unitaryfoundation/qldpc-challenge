# Ruff lint + format check (issue #658). The repo-wide report tracks legacy
# debt but remains advisory until the separate mechanical cleanup. Newly added
# Python files must be clean; edits to existing files are not forced to reformat
# unrelated legacy code.
name: lint

permissions:
  contents: read

on:
  # The merge-eligibility helper requires a `ruff` check on every PR head.
  # Sparse checkout keeps this low-cost on data-only and documentation PRs.
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent are enough for an added-file list.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            *.py
            **/*.py
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v5
      - name: repo-wide Ruff baseline (advisory)
        shell: bash
        run: |
          uv run --frozen --only-group dev ruff check --output-format github . > ruff-check.txt || true
          lint_count=$(grep -c "::error" ruff-check.txt || true)
          format_count=$(uv run --frozen --only-group dev ruff format --check --quiet . 2>/dev/null | wc -l || true)
          echo "## Ruff (repo-wide baseline; advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruff check: **${lint_count}** finding(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruff format check: **${format_count}** file(s) would be reformatted" >> "$GITHUB_STEP_SUMMARY"
          cat ruff-check.txt
          uv run --frozen --only-group dev ruff format --check . || true
      - name: blocking Ruff check on added Python files
        shell: bash
        run: |
          git diff --name-only --no-renames --diff-filter=A -z \
            "$GITHUB_SHA^1" "$GITHUB_SHA" -- '*.py' > "$RUNNER_TEMP/added-python-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/added-python-files"
          if ((${#files[@]} == 0)); then
            echo "No added Python files to lint."
            exit 0
          fi
          printf 'Linting %s added Python file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          uv run --frozen --only-group dev ruff check "${files[@]}"
          uv run --frozen --only-group dev ruff format --check "${files[@]}"

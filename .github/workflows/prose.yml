name: prose

# Runs on every PR, including docs-only ones (verify.yml deliberately skips those,
# but a note is exactly what needs checking here). Stdlib-only and seconds long.

permissions:
  contents: read

on:
  pull_request:
    # `edited` is not in the default set (opened, synchronize, reopened) and it is
    # the one that matters here: the checker reads the body from
    # `github.event.pull_request.body`, which is the body as of the triggering
    # event. Without it, editing a PR body to fix a cited path reruns nothing, and
    # re-running from the PR page replays the same stale payload -- so a body-only
    # failure could not be cleared except by an unrelated push (issue #897).
    # `edited` also fires on title and base changes; the job is stdlib-only and
    # takes about ten seconds, so that is a fair price.
    types: [opened, synchronize, reopened, edited]

# A burst of body edits should settle on the last one rather than race: the newest
# run for a PR wins and any older one still in flight is cancelled, so the check
# status always reflects the current body.
concurrency:
  group: prose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out submitted tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: submitted
      # The checker runs from the base branch, like every other check here: a PR
      # must not be able to weaken the check that judges it.
      - name: check out trusted tree (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          path: trusted
      # The PR body is untrusted input: it reaches the checker as a FILE via the
      # environment, never interpolated into a shell command.
      - name: capture PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
      - name: prose check (cited paths must resolve; no scaffolding left in)
        working-directory: trusted
        run: |
          if [ -f verify/check_prose.py ]; then
            python3 verify/check_prose.py \
              --root ../submitted \
              --base origin/${{ github.base_ref }} \
              --body-file "$RUNNER_TEMP/pr_body.md"
          else
            echo "base branch has no verify/check_prose.py yet; skipping"
          fi

name: verify

permissions:
  contents: read
  pull-requests: read   # check_pr_duplicates.py lists the open PRs (issue #4107)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      # run_tests.py collects cli/test_*.py too, so a cli-only PR must trigger
      # the suite: without this entry the tests below never run for it and the
      # PR merges with only ruff and prose on its rollup (PR #2321).
      - "cli/**"
      - "codes/**"
      # check_certs.py runs inside this workflow, so a certificate-only PR
      # (a level change, a new replay recipe) has to trigger it: without this
      # entry such a PR got prose and proof-replay and never the certificate
      # checker (PR #2806).
      - "certs/**"
      - "verify/**"
      - "decode/**"
      - "schema/**"
      - "research/**"
      # run_tests.py collects site/test_*.py too (and site/build.py renders every
      # verdict on the board), so a site/-only PR has to trigger the suite rather
      # than merge on ruff and prose alone.
      - "site/**"
      - "Makefile"
      - "run_tests.py"
      - "pyproject.toml"
      - "uv.lock"
      # Markdown can't affect anything the jobs below execute (run_tests.py only
      # runs test_*.py; the verifier reads codes/*.json), so docs-only PRs skip
      # the workflow entirely. A PR mixing .md with any matching file still runs.
      - "!**/*.md"
  push:
    branches: [main]
  # The board-wide LER replica (issue #2614): a push to main now re-measures
  # only what the merge changed, so the full re-measure of every claim moves
  # to a weekly run, after refute-weekly.yml's Monday 06:00 sweep.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

# Superseded runs queue rather than cancel (issue #2615). Cancelling threw
# away a gate that was about to come back clean whenever a push touched only
# a note or the PR body, and the replacement run paid the whole search again
# from a fresh seed, which the search cache cannot help with because a clean
# result is never stored. Actions cannot key a concurrency group on the diff,
# so the queued run instead exits early below when nothing the gate reads has
# changed since a run that already passed on these bytes. GitHub keeps one
# pending run per group, so a burst of pushes still costs one extra run.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Compile-only coverage for the optional CUDA accelerator.  This deliberately
  # does not require a GPU and is advisory until the hosted toolkit install is
  # proven stable.
  # Pinned to ubuntu-24.04 in every workflow (not ubuntu-latest): the label moved
  # to ubuntu-26.04 on 2026-10-31, whose NVIDIA apt repo has no cuda-nvcc-12-6
  # and whose default Python 3.14 has no pycryptosat wheel, so every run on
  # main and on PRs failed before any entry was checked.
  ris-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          method: network
          sub-packages: '["nvcc"]'
      - name: compile CUDA RIS accelerator
        run: nvcc -O3 -arch=sm_75 -c verify/ris_gpu.cu -o /dev/null

  verify:
    runs-on: ubuntu-24.04
    # 90 min fast-pass cap (gate_changed.FAST_SECONDS) + ~30 min of fixed steps
    # + margin. Hitting this means a hang or a bug, not a large code.
    timeout-minutes: 130
    env:
      PYTHONUNBUFFERED: "1"   # a killed step still leaves its log
      # The files whose change can alter a measured circuit.ler rate: the
      # measured-rate tier of verify_all.py, ler_verify.py and the modules it
      # imports (ler_tools.py, circuit_tools.py, gf2.py), the optional
      # accelerator those load (gf2_fast.cpp, built by setup_gf2_fast.py
      # through the Makefile), the decoder pin under decode/ that ler_tools
      # mirrors, and the dependency pins. verify/test_ler_stack.py pins this
      # list to the import closure of ler_verify.py, so a new import in the
      # LER code fails the suite until the list names it.
      LER_STACK: verify/verify_all.py verify/ler_verify.py verify/ler_tools.py verify/circuit_tools.py verify/gf2.py verify/gf2_fast.cpp verify/setup_gf2_fast.py decode pyproject.toml uv.lock Makefile
      # The directories that hold submitted data rather than code: an entry,
      # its circuit tier, its note or fieldnote, its repro manifest, its
      # certificate. This is check_submission_scope.py's SUBMISSION_SURFACE,
      # and verify/test_data_surface.py pins the two together. A pull request
      # whose every changed file is under one of these is data-only: it skips
      # the full self-test suite and runs the two narrower steps described in
      # `detect changed code submissions` below.
      DATA_SURFACE: codes circuits notes fieldnotes repro certs
    steps:
      - name: check out submitted tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the gate can diff vs the base
          path: submitted
      - name: check out trusted verifier tree (base branch)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          path: trusted
      - name: check out trusted verifier tree (current ref)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: trusted
      - uses: astral-sh/setup-uv@v5
      # The early exit (issue #2615). The gate and verify_all read the
      # submitted tree's codes/, circuits/, schema/ and decode/ and the trusted
      # tree's verifier stack; a digest over exactly those tree objects names
      # what a verdict was about. A run that passes saves its receipts under
      # that digest, and a later run on this PR whose digest matches skips the
      # expensive steps and re-uploads the saved receipts as its own, so a
      # notes-only push costs minutes rather than the hour the gate takes. This
      # comment-only edit is the live test of that path (issue #2615).
      # Three things keep this honest. Only a passing run saves, so a failure
      # is always re-run and a refutation can never be skipped past. The
      # digest covers the trusted tree too, so a base-branch verifier change
      # invalidates it. And the cache is scoped to this PR's own ref by
      # GitHub, so no other PR's verdict can be served here.
      - name: trusted validation stack integrity (the autoresearch gate can't be silently weakened)
        working-directory: submitted
        run: uv run --frozen python verify/check_validator_integrity.py
      - name: digest of what the gate reads
        if: github.event_name == 'pull_request'
        id: digest
        run: |
          set -euo pipefail
          tree() { git -C "$1" rev-parse --verify --quiet "HEAD:$2" 2>/dev/null || echo "absent"; }
          digest=$( {
            for p in codes circuits schema decode; do echo "submitted/$p $(tree submitted "$p")"; done
            for p in verify schema decode pyproject.toml uv.lock Makefile; do echo "trusted/$p $(tree trusted "$p")"; done
          } | sha256sum | cut -c1-32 )
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "gated-tree digest $digest"
      - name: look for a passing verdict on these bytes
        if: github.event_name == 'pull_request'
        id: verdict
        uses: actions/cache/restore@v4
        with:
          path: passed-verdict
          key: verify-passed-${{ github.event.pull_request.number }}-${{ steps.digest.outputs.digest }}
      - name: say what is being skipped
        if: github.event_name == 'pull_request' && steps.verdict.outputs.cache-hit == 'true'
        run: |
          echo "nothing the gate reads changed since a run that passed on these bytes; skipping verify_all and the gate (issue #2615)" | tee -a "$GITHUB_STEP_SUMMARY"
          cat passed-verdict/marker.json | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p receipts && cp -r passed-verdict/receipts/. receipts/ 2>/dev/null || true
      - name: detect changed code submissions
        if: github.event_name == 'pull_request'
        id: changes
        working-directory: submitted
        run: |
          base=origin/${{ github.base_ref }}
          # circuits/<slug>/ is part of an entry's claim surface (PR #1012): the
          # authorship check and the gate map it back to codes/<slug>.json, so a
          # circuits-only PR must take the same trusted path as a codes PR.
          #
          # D is in the filter (issue #2638). Removing an entry is a change to
          # the board, and leaving deletions out meant a PR that tightened a
          # rule in verify/ and deleted the entries the new rule would reject
          # read as a non-code PR: the scope check below never ran, and
          # verify_all ran from the PR's own tree rather than the trusted one.
          if git diff --quiet --diff-filter=AMD "$base"...HEAD -- codes circuits; then
            codes_changed=false
          else
            codes_changed=true
          fi
          # A PR whose every changed file lives in the submission surface
          # (DATA_SURFACE in this job's env) cannot have touched the stack the
          # self-tests exercise: it changed no test, no module a test imports,
          # no workflow and no pin. So the full suite is skipped for it, and
          # two narrower steps run in its place: the tests marked `board`,
          # which read the committed data as a whole, and the tests that name
          # an entry it changed (issue #2940), computed below. Anything else
          # changed -> the whole suite runs.
          #
          # The rule used to list codes/, circuits/, notes/ and fieldnotes/
          # and to require a codes/ or circuits/ change, which was two entries
          # short of what the scope check lets a submission carry. So a PR
          # that added a certificate, beside its entry or alone, ran every
          # self-test: about an hour of CI per PR, for a suite in which a
          # few tests open anything under certs/. The certificate checker is
          # not among the things skipped. It is its own step below and runs
          # on every event.
          #
          # A diff that cannot be computed exits non-zero, which the first
          # test reads as a data change and the second as a change outside
          # the data, so the suite runs (fail closed). $DATA_SURFACE and
          # $outside are unquoted so that they split into one pathspec per
          # entry.
          outside=""
          for d in $DATA_SURFACE; do outside="$outside :(exclude)$d"; done
          if ! git diff --quiet "$base"...HEAD -- $DATA_SURFACE && git diff --quiet "$base"...HEAD -- $outside; then
            data_only=true
          else
            data_only=false
          fi
          # Skipping the suite for such a PR is right about the stack, but a
          # self-test can name an entry by slug, and issue #2940 is what that
          # cost: #2901 tightened codes/646-162-26.json while
          # research/test_annihilator.py still asserted the old side value,
          # and because every changed file was under codes/ the step that
          # would have caught it never ran -- the breakage landed on main and
          # surfaced only with the next PR that touched a test. The slug is
          # right there in the test source, so ask the suite which files
          # mention an entry this PR changed and run exactly those: a grep
          # over four directories, no board load, and it would have caught
          # #2901 on #2901 itself. Only the slugs come from the PR's diff;
          # the files it can name are this tree's own tests, filtered to
          # that shape below before anything reaches pytest.
          #
          # A certificate and a repro manifest are named for their entry too
          # (certs/<slug>.json, certs/heuristic/<slug>.json, repro/<slug>.json),
          # and a test can pin what one of them says, so their slugs are read
          # the same way.
          #
          # The shape filter used to admit only a test directly under one of
          # the four directories. research/ has since grown subdirectories
          # (audits/, certs/, cost/, local2d/, provenance/) that hold 17 test
          # files, most of which name entries, and every one of them was
          # dropped here without a word. A path may now pass through
          # directories on the way to its test_*.py.
          slug_tests=""
          slugs=$(git diff --name-status --diff-filter=AMDRT "$base"...HEAD -- codes circuits certs repro \
                    | cut -f2- | tr '\t' '\n' \
                    | sed -n -e 's|^codes/\(.*\)\.json$|\1|p' \
                             -e 's|^circuits/\([^/]*\)/.*|\1|p' \
                             -e 's|^certs/\(.*/\)\{0,1\}\([^/]*\)\.json$|\2|p' \
                             -e 's|^repro/\([^/]*\)\.json$|\1|p' | sort -u)
          for slug in $slugs; do
            # Both spellings of one entry: the slug the file is named for,
            # and the [[n,k,d]] form a test may cite instead. -F keeps a
            # slug that looks like a pattern (and one that starts with a
            # dash) from meaning anything to grep.
            slug_tests="$slug_tests $(grep -rlF --include='test_*.py' \
                          -e "$slug" -e "${slug//-/,}" \
                          research verify site cli || true)"
          done
          slug_tests=$(printf '%s\n' $slug_tests \
                         | grep -E '^(research|verify|site|cli)/([A-Za-z0-9_]+/)*test_[A-Za-z0-9_.]+\.py$' \
                         | sort -u | tr '\n' ' ' | sed 's/ *$//' || true)
          if [ -n "$slug_tests" ]; then
            echo "self-tests naming an entry this PR changed: $slug_tests" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # A circuit.ler claim nothing in the PR touched can only go stale
          # through the stack that measures it: the measured-rate tier, the
          # decoder, the pinned dependencies (a stim bump in uv.lock) or the
          # accelerator build, which is the LER_STACK list in this job's env.
          # A PR that leaves all of those alone gets the --ler-base run; a PR
          # that touches any of them re-measures every claim. Everything else
          # under verify/ (the structural verifier, the circuit tier, the
          # gate, the policy checkers, tests, fixtures, the integrity
          # manifest) runs on every entry in the --ler-base pass as well and
          # cannot change a measured rate, so it is left out. The list used
          # to be all of verify/ minus tests, checkers, and fixtures: a
          # prose-checker edit scheduled the full re-measure on PR #3418, and
          # once those were excluded a schema-check edit did on #4653 and
          # #4682, which with about an hour of self-tests runs past this
          # job's 130-minute timeout. A diff that cannot be computed exits
          # non-zero and so counts as changed (fail closed). $LER_STACK is
          # unquoted so that it splits into one pathspec per entry.
          if git diff --quiet "$base"...HEAD -- $LER_STACK; then
            ler_stack_changed=false
          else
            ler_stack_changed=true
          fi
          echo "codes_changed=$codes_changed" >> "$GITHUB_OUTPUT"
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
          echo "slug_tests=$slug_tests" >> "$GITHUB_OUTPUT"
          echo "ler_stack_changed=$ler_stack_changed" >> "$GITHUB_OUTPUT"
      - name: detect what the merge changed (push to main)
        if: github.event_name == 'push'
        id: merge
        working-directory: submitted
        # Issue #2614. A push to main used to re-measure every circuit.ler
        # claim on the board, about 21 CPU-hours per merge, to reconfirm
        # numbers the PR that introduced them had measured hours earlier. The
        # merge's own diff is what can have changed a claim: the entries it
        # touched (verify_all --ler-base handles those) and the stack that
        # measures them (the LER_STACK list in this job's env). A diff that
        # cannot be computed, including the all-zero `before` of a new branch
        # or a force push, counts as a stack change, so the fallback is the
        # full re-measure, never a skip.
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            ler_stack_changed=true
          elif git diff --quiet "$before"...HEAD -- $LER_STACK; then
            ler_stack_changed=false
          else
            ler_stack_changed=true
          fi
          echo "ler_stack_changed=$ler_stack_changed" >> "$GITHUB_OUTPUT"
      - name: provenance table staleness (advisory, issue #4023)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true'
        working-directory: submitted
        # research/provenance/derived.json cannot be regenerated here (the
        # literature index is not shipped), so a code PR is never asked to
        # update it; the weekly provenance-top-up workflow does. This only
        # puts the backlog on the PR that grows it. Never fails.
        run: |
          out=$(python3 research/derive_provenance.py --check || true)
          printf '%s\n' "$out"
          stale=$(printf '%s\n' "$out" | sed -n 's/^derived provenance is STALE: //p')
          if [ -n "$stale" ]; then
            echo "::warning title=research/provenance/derived.json is behind the board::${stale} The weekly provenance-top-up workflow records them as not_derived; nothing to do in this PR."
          fi
      - name: submission scope check (code data cannot change its own verifier)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true'
        working-directory: trusted
        run: uv run --frozen python verify/check_submission_scope.py --root ../submitted --base origin/${{ github.base_ref }}
      - name: "duplicate check against the other open PRs (issue #4107)"
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true'
        working-directory: trusted
        # verify_all sees one tree. Two PRs that each added a presentation of
        # the same code (#4064 and #4069, an X/Z swap apart) passed alone and
        # merged minutes apart, and every run on main then failed on the pair
        # until a removal landed (issue #4103). This compares the PR's entries
        # with those of every other open PR under the identities verify_all
        # files an entry under and refuses the later filing. The trusted copy
        # runs, as for the scope check, and it runs on a verdict-cache hit too,
        # because the other PRs are not in the digest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python verify/check_pr_duplicates.py --root ../submitted --base origin/${{ github.base_ref }} --repo "${{ github.repository }}" --pr-number "${{ github.event.pull_request.number }}"
      - name: certificate levels (no cert may claim evidence it lacks)
        working-directory: submitted
        run: uv run --frozen python verify/check_certs.py
      - name: tree consistency (an artifact may not outlive its entry)
        working-directory: trusted
        # check_certs validates a certificate without asking whether its entry
        # still exists, and check_prose reads only files the PR changes, so a
        # note or cert left behind by a removal elsewhere was never seen by
        # anything. This is the sweep that closes that gap.
        #
        # The base branch's copy of the checker, run against the submitted
        # tree: a PR that edits this file and re-pins the manifest must not be
        # judged by its own weakened copy. That is the rule prose.yml and the
        # scope check above already follow; check_certs.py still runs the
        # submitted copy, which this deliberately does not repeat.
        #
        # PRs that touch only prose do not reach this workflow at all (the
        # paths filter in `on:` skips *.md), so prose.yml runs the same sweep
        # from its own trusted checkout; this one covers push and schedule.
        run: |
          if [ -f verify/check_tree_consistency.py ]; then
            uv run --frozen python verify/check_tree_consistency.py --root ../submitted
          else
            echo "base branch has no verify/check_tree_consistency.py yet; skipping"
          fi
      # Cheap metadata checks run BEFORE the (up to ~95-minute) refutation gate: a PR that
      # fails one of them should not first burn a full gate run (PR #278 spent the
      # whole gate on 18 valid layouts and then died on one authorship mismatch).
      - name: authorship check (PR author must be a listed @handle author)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true'
        working-directory: trusted
        run: uv run --frozen python verify/check_authorship.py --root ../submitted --author "${{ github.event.pull_request.user.login }}" --base origin/${{ github.base_ref }}
      # Build the optional RIS accelerator in each tree that runs searches. Best
      # effort (continue-on-error): the python passes are the gate's baseline and
      # run unchanged without it, so a failed build only costs the extra depth.
      # For code PRs the gate runs from the trusted tree, so the extension is
      # compiled from BASE-BRANCH source -- a PR cannot alter the C++ it is gated by.
      - name: build optional refutation accelerator (trusted tree)
        if: github.event_name == 'pull_request' && steps.verdict.outputs.cache-hit != 'true'
        working-directory: trusted
        continue-on-error: true
        run: make fast
      - name: build optional refutation accelerator (submitted tree)
        working-directory: submitted
        continue-on-error: true
        run: make fast
      - name: self-tests (every test_*.py run_tests.py collects; skipped for data-only PRs)
        if: github.event_name != 'pull_request' || steps.changes.outputs.data_only != 'true'
        working-directory: submitted
        # --durations: the job's biggest fixed cost, which used to report one total
        run: uv run --frozen --extra research python run_tests.py --durations=20
      - name: self-tests that read the committed data as a whole (data-only PRs)
        if: github.event_name == 'pull_request' && steps.changes.outputs.data_only == 'true'
        working-directory: submitted
        # A data-only PR skips the suite above, and until this step that meant
        # no test reading the board as a set ran before the merge. #5249, #5250
        # and #5251 each added one genon entry, each passed here, and
        # verify/test_family_tag_consistency.py then failed on main until #5275:
        # the push to main was the first run of a test any of the three could
        # have failed in review. `-m board` selects the tests marked as reading
        # the committed data as a whole (conftest.py says which tests get the
        # mark). The marked set is the cheap one on purpose, seconds in all, so
        # the fast path stays fast: a test that pays for a full board pass is
        # left out and still runs on the push.
        run: uv run --frozen --extra research python run_tests.py -m board --durations=20
      - name: "self-tests that name an entry this PR changed (issue #2940)"
        if: github.event_name == 'pull_request' && steps.changes.outputs.data_only == 'true' && steps.changes.outputs.slug_tests != ''
        working-directory: submitted
        # The other half of what replaces the suite for a data-only PR: the
        # tests whose source names a slug the PR changed, under codes/,
        # circuits/, certs/ or repro/, so editing an entry or its certificate
        # can no longer break a test that pins it and have CI shrug (#2901 ->
        # #2940). A grep-list of this tree's own test files, not paths the PR
        # invented; it arrives through the environment rather than ${{ }} in
        # the script, because an environment variable is never re-parsed as
        # shell.
        env:
          SLUG_TESTS: ${{ steps.changes.outputs.slug_tests }}
        run: uv run --frozen --extra research pytest -q $SLUG_TESTS
      - name: verify all submissions (trusted verifier for code changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true' && steps.verdict.outputs.cache-hit != 'true'
        working-directory: trusted
        # --ler-base: the sampled LER replica (~4 min/entry on the runner) runs only
        # for entries this PR changed; unchanged claims are re-measured by any run
        # that touches the LER stack and by the weekly scheduled run (the steps
        # below).
        #
        # --circuit-base: the circuit tier (circuit_verify) is deterministic
        # and reads one entry and its circuits/<slug>/ directory, and on
        # 2026-11-10 re-running it for the 718 entries that carry a circuit
        # took 44.5 of this step's 48 minutes on every PR, which with a
        # 90-minute gate no longer fit this job's cap. For an entry the PR
        # did not touch, the tier can only repeat what the base branch found
        # on the same bytes with the same verifier, so it is run for the
        # entries the PR changed and skipped for the rest.
        #
        # --circuit-jobs 0, here and on the three sweeps below: the entries
        # whose tier does run are checked in one process per CPU, and all of
        # them before the measured-rate tier starts, so a sampled rate never
        # shares the CPUs with the pool. A check reads one entry and its own
        # directory, so the verdicts are the serial ones.
        #
        # "The same verifier" is verify_all's to check, not this file's: it
        # compares its own CIRCUIT_STACK with the base branch's and checks
        # every circuit if any file differs, so the flag is passed on every
        # pull request. Here the verifier is the trusted tree, which is the
        # base branch, so the two always agree. This step used to pass the
        # flag only when the PR was data-only. verify_all.py's docstring has
        # the argument in full. The value arrives through the environment,
        # as SLUG_TESTS does above.
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          uv run --frozen --extra research python verify/verify_all.py --root ../submitted --ler-base "$BASE_REF" --circuit-base "$BASE_REF" --circuit-jobs 0
      - name: verify all submissions (LER stack unchanged)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed != 'true' && steps.changes.outputs.ler_stack_changed != 'true' && steps.verdict.outputs.cache-hit != 'true'
        working-directory: submitted
        # A non-code PR that leaves verify/, decode/ and the pinned dependencies
        # alone cannot have changed what any existing ler claim measures, so it
        # re-measures nothing (the diff vs base is empty under codes/ and circuits/).
        #
        # This step runs the PR's own verifier, and --circuit-base is only
        # sound while that verifier is the base branch's. verify_all decides
        # that itself, from the diff of its CIRCUIT_STACK against the base:
        # a PR that edits the verifier, the schema, a dependency pin or
        # this file has the tier run on every entry, which is the case it
        # exists for, and a PR that edits a test, the site or research/
        # does not repeat the base branch's run. It used to: the flag was
        # withheld from every PR that was not data-only.
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          uv run --frozen --extra research python verify/verify_all.py --ler-base "$BASE_REF" --circuit-base "$BASE_REF" --circuit-jobs 0
      # The circuit record: which entries have passed the circuit tier on
      # main, on which bytes, under which verifier. A run on main has no base
      # branch to lean on, and re-running the tier for every entry on every
      # merge grows with the board (223 entries carried a circuit on
      # 2026-11-04, 740 a week later, about 4 s each). With the record, a
      # push re-runs the entries no run on main has passed on these bytes
      # under this verifier and nothing else. verify_all.py's docstring has
      # the argument; what this file owes it is where the record may come
      # from and go to.
      #
      # This cache IS trusted, unlike the search cache below, so it is kept
      # to main at both ends. It is restored only on a push, and the only
      # pushes this workflow runs on are to main. It is saved only from a
      # run on main that is not a pull request. GitHub scopes a cache to the
      # ref that wrote it, so no pull request can write an entry a run on
      # main will read, and no pull request step is handed the record: the
      # sweeps above pass --circuit-base and never --circuit-record.
      # verify/test_verify_all.py reads these conditions back.
      #
      # The scheduled run and a manual dispatch do not restore it. They
      # check every circuit and write the record afresh, so nothing in it
      # is more than a week from a from-scratch check, and an evicted cache
      # costs one full sweep rather than coverage.
      #
      # The key is per run and attempt because cache entries are immutable;
      # the prefix is what lets a later run find the newest record.
      - name: restore the circuit record (push to main)
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: circuit-record
          key: circuit-record-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            circuit-record-
      - name: verify all submissions (push to main, LER scoped to the merge)
        if: github.event_name == 'push' && steps.merge.outputs.ler_stack_changed != 'true'
        working-directory: submitted
        # The merge's diff against the previous head of main. An entry the
        # merge did not touch keeps the rate the PR that introduced it
        # measured; a base that cannot be diffed makes verify_all re-measure
        # everything (its own fail-open rule), so a skip is never silent.
        run: uv run --frozen --extra research python verify/verify_all.py --ler-base ${{ github.event.before }} --circuit-record ../circuit-record/record.json --circuit-jobs 0
      - name: verify all submissions (full LER re-measure)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.merge.outputs.ler_stack_changed == 'true') || (github.event_name == 'pull_request' && steps.changes.outputs.codes_changed != 'true' && steps.changes.outputs.ler_stack_changed == 'true' && steps.verdict.outputs.cache-hit != 'true')
        working-directory: submitted
        # Four kinds of run reach this step, and the circuit tier is scoped
        # for each as the steps above scope it. A pull request gets
        # --circuit-base, which verify_all voids when the verifier stack
        # differs from the base (nearly every file of the LER stack is in
        # that stack, so in practice this is the whole tier). A run on main
        # gets the record: a push restored it above, and a scheduled or
        # dispatched run finds none, checks everything and writes a new one.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            circuit="--circuit-base $BASE_REF"
          else
            circuit="--circuit-record ../circuit-record/record.json"
          fi
          uv run --frozen --extra research python verify/verify_all.py $circuit --circuit-jobs 0
      # always(): a sweep that fails on one entry still earned its other
      # passes, and only passes are in the file. hashFiles: a sweep that
      # never ran wrote nothing to save.
      - name: save the circuit record (runs on main)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('circuit-record/record.json') != ''
        uses: actions/cache/save@v4
        with:
          path: circuit-record
          key: circuit-record-${{ github.run_id }}-${{ github.run_attempt }}
      # A completed refutation, carried between runs of the same PR (issue
      # #2633). gate_changed.py diffs against the base branch, so a PR that
      # adds a code has a non-empty diff on every push, and a push that only
      # fixed prose re-paid the whole search.
      #
      # This cache is NOT trusted. A run executes the PR's own copy of this
      # workflow, and the submitted tree's accelerator build runs before any
      # gate, so a contributor can write whatever they like here. Only a
      # refutation is ever served back, and the gate re-validates its witness
      # against the candidate before believing it, so a planted record either
      # proves the claimed distance wrong or is discarded. A clean result is
      # never stored, because there would be nothing to re-check.
      #
      # restore-keys is a PR-scoped prefix because the primary key is per run
      # and attempt, so the prefix is what makes a later run see an earlier
      # one's record at all. GitHub scopes caches to the PR's own ref, so the
      # prefix cannot reach another PR's entries.
      - name: restore completed searches
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true' && steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: search-cache
          key: gate-search-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gate-search-${{ github.event.pull_request.number }}-
      - name: distance refutation gate (trusted verifier for code changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true' && steps.verdict.outputs.cache-hit != 'true'
        working-directory: trusted
        run: uv run --frozen --extra research python verify/gate_changed.py --code-root ../submitted origin/${{ github.base_ref || 'main' }} --receipt-dir ../receipts --search-cache ../search-cache --pr-number "${{ github.event.pull_request.number }}" --pr-author "${{ github.event.pull_request.user.login }}" --base-sha "${{ github.event.pull_request.base.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}"
      # Saved on failure as well as success, which is the case this exists
      # for: five of the six measured re-gatings were failure -> success, so a
      # save that only ran on a green job would never produce a hit. Split
      # restore/save rather than actions/cache for exactly that reason, and
      # keyed per run and attempt because cache entries are immutable.
      - name: save completed searches
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true' && steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: search-cache
          key: gate-search-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: distance refutation gate (changed submissions only)
        if: github.event_name != 'pull_request'
        working-directory: submitted
        run: uv run --frozen --extra research python verify/gate_changed.py origin/${{ github.base_ref || 'main' }}
      - name: upload verification receipts
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.codes_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipts-${{ github.event.pull_request.number }}
          path: receipts/
          if-no-files-found: warn
      # Only a run in which every step above succeeded records a verdict, and
      # the record carries the receipts so a skipping run can re-upload them.
      - name: record the passing verdict on these bytes
        if: success() && github.event_name == 'pull_request' && steps.verdict.outputs.cache-hit != 'true'
        run: |
          mkdir -p passed-verdict
          [ -d receipts ] && cp -r receipts passed-verdict/receipts || true
          printf '{"digest": "%s", "run_id": "%s", "run_attempt": "%s", "head_sha": "%s", "passed_at": "%s"}\n' \
            "${{ steps.digest.outputs.digest }}" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "${{ github.event.pull_request.head.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > passed-verdict/marker.json
      - name: save the passing verdict
        if: success() && github.event_name == 'pull_request' && steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: passed-verdict
          key: verify-passed-${{ github.event.pull_request.number }}-${{ steps.digest.outputs.digest }}

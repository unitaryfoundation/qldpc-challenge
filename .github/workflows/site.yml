name: site

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "codes/**"
      - "notes/**"        # rendered into docs/codes/<slug>.html
      - "fieldnotes/**"   # rendered into docs/research-log.html
      - "certs/**"
      - "receipts/**"
      - "site/**"
      - "verify/**"
      - "refs.bib"
      - "pyproject.toml"
      - "uv.lock"

# Serialize rebuilds so two quick merges don't race each other's push.
concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # The board memo on main (issue #7253): the structural reports
      # verify.yml's runs on main wrote, keyed on each entry's bytes, the
      # validator closure and the bytes of the entries it reads, so the
      # build verifies the merge and reads the rest. This workflow runs on
      # pushes to main only, so both ends of the cache are main's; the
      # memo this build adds is saved for the next run.
      - name: restore the board memo (main)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: board-memo
          key: board-memo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            board-memo-
      - name: rebuild and commit regenerated pages (race-safe)
        env:
          QLDPC_BOARD_CACHE: ${{ github.workspace }}/board-memo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each run is triggered by its own merge commit, so a rebase of the
          # rebuild commit conflicts against another run's rebuild. Instead,
          # reset to the LATEST main, rebuild fresh, and retry push on any race
          # -- this always converges docs/ to the current code state.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # research/repro/multisize.json is derived from repro/ and the kit
            # constructors and read by the code pages. A submission PR cannot
            # carry it (issue #3810), so it is regenerated here, after the
            # merge, and committed with the pages; `run` leaves the file alone
            # when no row changed.
            uv run --frozen --extra research python research/kit/multisize.py run
            make build
            git add docs/*.html docs/codes docs/stats.json docs/style.css docs/favicon.svg research/repro/multisize.json
            if git diff --cached --quiet; then
              echo "site already up to date"; exit 0
            fi
            git commit -m "Rebuild leaderboard site [skip ci]"
            if git push origin main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push raced; retrying ($attempt)"
          done
          echo "failed to push after 5 attempts"; exit 1
      - name: save the board memo (main)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('board-memo/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: board-memo
          key: board-memo-${{ github.run_id }}-${{ github.run_attempt }}

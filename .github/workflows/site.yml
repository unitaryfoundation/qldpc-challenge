name: site

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "codes/**"
      - "notes/**"        # rendered into docs/codes/<slug>.html
      - "fieldnotes/**"   # rendered into docs/research-log.html
      - "certs/**"
      - "receipts/**"
      - "site/**"
      - "verify/**"
      - "refs.bib"
      - "pyproject.toml"
      - "uv.lock"

# Serialize rebuilds so two quick merges don't race each other's push.
concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: rebuild and commit regenerated pages (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each run is triggered by its own merge commit, so a rebase of the
          # rebuild commit conflicts against another run's rebuild. Instead,
          # reset to the LATEST main, rebuild fresh, and retry push on any race
          # -- this always converges docs/ to the current code state.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # research/repro/multisize.json is derived from repro/ and the kit
            # constructors and read by the code pages. A submission PR cannot
            # carry it (issue #3810), so it is regenerated here, after the
            # merge, and committed with the pages; `run` leaves the file alone
            # when no row changed.
            uv run --frozen --extra research python research/kit/multisize.py run
            make build
            git add docs/*.html docs/codes docs/stats.json docs/style.css docs/favicon.svg research/repro/multisize.json
            if git diff --cached --quiet; then
              echo "site already up to date"; exit 0
            fi
            git commit -m "Rebuild leaderboard site [skip ci]"
            if git push origin main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push raced; retrying ($attempt)"
          done
          echo "failed to push after 5 attempts"; exit 1

name: certify-weekly

# research/certs/todo.json orders every upper-bound entry by what certifying
# it is worth and what it should cost (certification-queue.yml regenerates it
# on Monday at 08:00); this is the job that works its head (issue #4148).
# research/certs/certify_sweep.py opens entries in queue order and runs
# verify/sat_certify.py with the proof path on each, one time limit per
# solve, until the job budget is spent. Every attempt, closed or not, is one
# line of research/certs/attempts.jsonl, committed to main here so an entry
# that timed out at this budget is not reopened at the same budget next week.
# An entry it certified is left alone for 14 days while its PR lands, then
# solved again, so a PR that never opened or never merged cannot lock it
# out; and the run's output directory is uploaded as a 30-day artifact
# whatever happens after the sweep, so a failed step loses no solving.
# The certificates that close are staged on a branch in the #3666 shape (the
# certifier's record without its proof blocks, plus a proof_log_batch.jsonl
# row) and opened as a certs-only PR, after verify/check_certs.py and a
# replay of the staged proof_log certificates have run on the branch.
#
# A pull request opened with the Actions token gets no pull_request runs, so
# the PR's own checks do not start by themselves: close and reopen it, or
# push an empty commit, and verify.yml and proof-replay.yml run. A
# fine-grained token in the SWEEP_PR_TOKEN secret (contents and pull
# requests, read and write, on this repository) makes its owner the PR
# author and the checks start on their own.
#
# A side that comes back SAT is a logical lighter than the claim: the sweep
# stages nothing for that entry, exits 3, and the last step opens an issue
# with the witnesses' weights. The weekly refutation sweep is the usual way
# an over-claim is caught; this is a second one.

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  schedule:
    - cron: "0 12 * * 1"      # every Monday 12:00 UTC, after the queue regenerates at 08:00
  workflow_dispatch:
    inputs:
      tlim:
        description: "seconds per solve"
        required: false
        default: "600"
      job_minutes:
        description: "stop opening entries after this many minutes"
        required: false
        default: "240"
      slugs:
        description: "space-separated slugs to try instead of the queue head"
        required: false
        default: ""
      retry:
        description: "reopen entries that timed out at this budget before"
        type: boolean
        default: false

concurrency:
  group: certify-weekly
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # The same pins as proof-replay.yml, so the certificates this stages are
  # produced by the solver and checker that replay them.
  KISSAT_REF: 8af8e56f174b778aef3aa45af9f739b2a5f492c2    # rel-4.0.4
  DRAT_TRIM_REF: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985

jobs:
  sweep:
    runs-on: ubuntu-latest
    # job_minutes is when the sweep stops opening entries; the entry it is on
    # may run to six solves of tlim (two XOR solves, two kissat runs, two
    # drat-trim checks) past that, plus the build and the replay.
    timeout-minutes: 350
    env:
      OUT_DIR: ${{ runner.temp }}/certify-sweep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: build kissat and drat-trim
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout -q "$KISSAT_REF"
          (cd /tmp/kissat && ./configure >/dev/null && make -s -j"$(nproc)")
          git clone -q https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout -q "$DRAT_TRIM_REF"
          (cd /tmp/drat-trim && make -s drat-trim)
          install -m 755 /tmp/kissat/build/kissat /usr/local/bin/kissat
          install -m 755 /tmp/drat-trim/drat-trim /usr/local/bin/drat-trim
          kissat --version
      - name: work the head of the queue
        id: sweep
        env:
          TLIM: ${{ github.event.inputs.tlim || '600' }}
          JOB_MINUTES: ${{ github.event.inputs.job_minutes || '240' }}
          SLUGS: ${{ github.event.inputs.slugs }}
          RETRY: ${{ github.event.inputs.retry }}
        run: |
          retry=""
          [ "$RETRY" = "true" ] && retry="--retry"
          set +e
          uv run --frozen --extra research python research/certs/certify_sweep.py run \
            --out-dir "$OUT_DIR" --tlim "$TLIM" --job-seconds $(( JOB_MINUTES * 60 )) \
            ${SLUGS:+--slugs $SLUGS} $retry
          rc=$?
          set -e
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          staged=$(ls "$OUT_DIR"/certs/*.json 2>/dev/null | grep -c . || true)
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 3 is a refutation, reported by the last step; anything else nonzero is a crash.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      - name: keep the run's output whatever happens next
        if: always() && steps.sweep.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: certify-sweep-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
          if-no-files-found: warn
      - name: commit the attempt log (race-safe)
        if: always() && steps.sweep.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/certs/attempts.jsonl
          if git diff --cached --quiet; then
            echo "no attempt to record"; exit 0
          fi
          counts=$(cat "$OUT_DIR/counts.txt" 2>/dev/null || echo "run ended before its tally")
          git commit -m "Weekly certification sweep: $counts [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push raced; rebasing and retrying ($attempt)"
            git fetch origin main && git rebase origin/main || exit 1
          done
          echo "failed to push the attempt log after 5 attempts"; exit 1
      - name: stage the certificates on a branch and open the certs-only PR
        if: steps.sweep.outputs.staged != '0'
        env:
          GH_TOKEN: ${{ secrets.SWEEP_PR_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          branch="certs/weekly-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="$branch-${{ github.run_number }}"
          fi
          git checkout -q -B "$branch" origin/main
          uv run --frozen python research/certs/certify_sweep.py stage --out-dir "$OUT_DIR" | tee stage.txt
          slugs=$(sed -n 's/^staged: //p' stage.txt)
          if [ -z "$slugs" ] || [ "$slugs" = "nothing" ]; then
            echo "every staged certificate landed meanwhile"; exit 0
          fi
          uv run --frozen python verify/check_certs.py | tee -a "$GITHUB_STEP_SUMMARY"
          # Replay the staged proof_log certificates that recorded two minutes
          # or less of solving and checking; proof-replay.yml's weekly run
          # replays every one in full.
          replay=$(uv run --frozen python -c "
          import json, sys
          rows = [json.loads(l) for l in open('certs/proof_log_batch.jsonl') if l.strip()]
          want = set(sys.argv[1:])
          quick = [r for r in rows if r['slug'] in want
                   and sum((r.get(s + '_' + k) or 0) for s in 'XZ' for k in ('solve_secs', 'check_secs')) <= 120]
          print(' '.join(r['slug'] for r in quick))" $slugs)
          if [ -n "$replay" ]; then
            {
              echo; echo '```'
              uv run --frozen --extra certify python verify/replay_proofs.py --tlim 1800 $replay
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          title=$(uv run --frozen python research/certs/certify_sweep.py pr-body --out-dir "$OUT_DIR" --out body.md)
          git add certs
          git commit -q -m "$title"
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file body.md
      - name: open an issue for a refuted claim
        if: steps.sweep.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title=$(uv run --frozen python research/certs/certify_sweep.py issue --out-dir "$OUT_DIR" --out issue.md)
          if [ -n "$title" ]; then
            gh issue create --repo "$REPO" --title "$title" --body-file issue.md
          fi
          exit 1
